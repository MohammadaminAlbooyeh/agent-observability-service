name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: obs
          POSTGRES_PASSWORD: obs
          POSTGRES_DB: obs_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U obs -d obs_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run lint
        run: |
          pip install ruff
          ruff check src/ tests/ sdk/ scripts/

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://obs:obs@localhost:5432/obs_test
          JWT_SECRET: test-secret-do-not-use-in-prod
          VALID_API_KEYS: test-key
        run: |
          python -m pytest tests/ -v

      - name: Initialize database schema (alembic check)
        env:
          DATABASE_URL: postgresql+asyncpg://obs:obs@localhost:5432/obs_test
        run: |
          alembic upgrade head
