name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: obs
          POSTGRES_PASSWORD: obs
          POSTGRES_DB: obs_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U obs -d obs_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      JWT_SECRET: test-secret-do-not-use-in-prod

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests sdk scripts alembic

      - name: Migrations apply, roll back, and match the models
        env:
          DATABASE_URL: postgresql+asyncpg://obs:obs@localhost:5432/obs_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

      - name: Tests (SQLite)
        run: python -m pytest -q

      - name: Tests (Postgres)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://obs:obs@localhost:5432/obs_test
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile -t agent-observability:ci .
