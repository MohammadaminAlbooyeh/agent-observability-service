[alembic]
# path to migration scripts
script_location = alembic
prepend_sys_path = .

# The database URL comes from DATABASE_URL via src.config.settings (see alembic/env.py).

# version location
version_locations = %(here)s/alembic/versions

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
timezone =

# max length of characters to apply to the
# "version" code of a new migration
max_version_chars = 255

# version code separator; used for multiple version directories
version_code_separator = _

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.
# See https://alembic.sqlalchemy.org/en/latest/api/hooks.html
# for more details and available hooks.

# Uncomment the line below to run the "black" autoformatter
# on newly generated migration scripts.
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
handlers =

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
